name: Epic
description: Parent issue spanning multiple child stories or sub-epics
title: "[Epic]: "
body:
  - type: markdown
    attributes:
      value: |
        Standard issue authoring rules: [appire_docs/docs/engineering/standards/issue_authoring.md](https://github.com/App-Empire-LLC/appire_docs/blob/main/docs/engineering/standards/issue_authoring.md). The epic should describe the larger outcome and boundaries — don't duplicate every child's acceptance criteria here. Link to the children instead.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What meaningful product or business outcome does this epic deliver?
      placeholder: Describe the shared outcome this epic is driving.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why are we doing this now? Strategic reason, urgency, expected value, risk reduction.
      placeholder: Strategic reason, urgency, expected value, risk reduction, etc.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What major workstreams or themes are included? Stay at the epic level — per-feature detail belongs in the children.
      placeholder: |
        - ...
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: child_work
    attributes:
      label: Child issues / work items
      description: Add related issues if they already exist.
      placeholder: |
        - #123
        - org/repo#456
        - org/repo#789

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: |
        What is explicitly not part of this epic? Be specific.

        Note: negative wording (does not, must not, regardless of) is fine in this section — it's about exclusion. But if it shows up in "Done when" below, see the Verification-Scope Ambiguity anti-pattern in the standard.

  - type: textarea
    id: done_when
    attributes:
      label: Done when (Definition of Done)
      description: |
        Implementer-side completion criteria for the epic as a whole — "I can stop working on this epic now." Distinct from per-child acceptance criteria; see the AC vs DoD section of issue_authoring.md.

        Common epic-level DoD items beyond "all children closed":
        • Integration tested across the epic surface
        • Cross-cutting docs / ADRs updated
        • Operational requirements satisfied (deployed, monitored, runbook)
      placeholder: |
        - All linked child issues closed.
        - ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Dependencies, risks, links, related docs, etc.
